name: Practical 3 - Hotel ML Quality Gate
on:
  push:
    branches:
      - main
    paths:
      - 'practical3/**'
      - '.github/workflows/p3-quality-gate.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train-gate-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install ML dependencies
        run: pip install -r requirements.txt
      - name: Train hotel cancellation model
        run: python practical2/train_model.py
      - name: Check ML quality gate
        run: python practical3/quality_gate.py
      - name: Run automated ML tests
        run: python -m unittest discover -s practical2 -v
