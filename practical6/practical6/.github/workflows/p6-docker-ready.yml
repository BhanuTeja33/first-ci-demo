name: Practical 6 - Docker-Ready Release
on:
  push:
    branches:
      - main
    paths:
      - 'practical6/**'
      - '.github/workflows/p6-docker-ready.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Train hotel cancellation model
        run: python practical2/train_model.py
      - name: Check ML quality gate
        run: python practical3/quality_gate.py
      - name: Run automated ML tests
        run: python -m unittest discover -s practical2 -v
      - name: Run prediction application tests
        run: python -m unittest discover -s practical5 -v
      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp practical5/app.py release_candidate/
          cp hotel_cancellation_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp practical6/Dockerfile release_candidate/
          cp practical6/.dockerignore release_candidate/
          {
            echo "Hotel Cancellation Prediction ML Application"
            echo "Build: docker build -t hotel-cancellation-ml:1.0 ."
            echo "Run: docker run -d --name hotel-cancellation-ml-container -p 5000:5000 hotel-cancellation-ml:1.0"
            echo "Endpoint: POST /predict"
          } > release_candidate/DEPLOYMENT.txt
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: hotel-cancellation-ml-docker-release
          path: release_candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
